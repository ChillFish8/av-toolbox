[package]
name = "av-toolbox-transforms"
version = "0.1.0"
edition = "2024"

[dependencies]
av-scenechange = { workspace = true, optional = true }
av-toolbox-core = { path = "../av-toolbox-core" }
av-toolbox-gpu = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
v_frame = { workspace = true, optional = true }

[dev-dependencies]
av-toolbox-gpu = { workspace = true, features = ["test-support"] }
serde_json = { workspace = true }

[features]
default = ["scene"]
scene = ["dep:av-scenechange", "dep:v_frame"]
vulkan = ["av-toolbox-gpu/vulkan", "av-toolbox-core/vulkan"]
metal = ["av-toolbox-gpu/metal", "av-toolbox-core/metal"]
cuda = ["av-toolbox-gpu/cuda", "av-toolbox-core/cuda"]
rocm = ["av-toolbox-gpu/rocm", "av-toolbox-core/rocm"]
gpu-tests = ["av-toolbox-gpu/gpu-tests"]
