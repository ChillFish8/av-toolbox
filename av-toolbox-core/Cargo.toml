[package]
name = "av-toolbox-core"
version = "0.1.0"
edition = "2024"

[dependencies]
av-toolbox-cubek = { path = "../av-toolbox-cubek" }
av-toolbox-gpu = { workspace = true }
cubecl = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
jsonschema = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
av-toolbox-cubek = { path = "../av-toolbox-cubek", features = ["test-support"] }
av-toolbox-gpu = { workspace = true, features = ["test-support"] }

[features]
vulkan = ["av-toolbox-cubek/vulkan", "av-toolbox-gpu/vulkan"]
metal = ["av-toolbox-cubek/metal", "av-toolbox-gpu/metal"]
cuda = ["av-toolbox-cubek/cuda", "av-toolbox-gpu/cuda"]
rocm = ["av-toolbox-cubek/rocm", "av-toolbox-gpu/rocm"]
gpu-tests = ["av-toolbox-gpu/gpu-tests"]
