[workspace]
resolver = "3"
members = [
    "av-toolbox",
    "av-toolbox-build",
    "av-toolbox-core",
    "av-toolbox-cubek",
    "av-toolbox-filters",
    "av-toolbox-graph",
    "av-toolbox-masks",
    "av-toolbox-models",
    "av-toolbox-pipeline",
    "av-toolbox-runtime",
    "av-toolbox-gpu",
    "av-toolbox-sinks",
    "av-toolbox-sources",
    "av-toolbox-providers",
    "thirdparty/bestsource",
    "thirdparty/vship",
]

[workspace.package]
version = "0.2.0"
license = "EUPL-1.2"
repository = "https://github.com/ChillFish8/av-toolbox"

[profile.test-release]
inherits = "release"
debug-assertions = true
overflow-checks = true

[workspace.dependencies]
bindgen = "0.73"
bytesize = "2.7"
cc = "1.2"
codespan-reporting = "0.13"
console = "0.16"
ctrlc = "3.5"
cubek-convolution = { git = "https://github.com/tracel-ai/cubek", rev = "a60992c47e51970602efdaa473ec83d76233ea47" }
cubek-matmul = { git = "https://github.com/tracel-ai/cubek", rev = "a60992c47e51970602efdaa473ec83d76233ea47" }
cubek-std = { git = "https://github.com/tracel-ai/cubek", rev = "a60992c47e51970602efdaa473ec83d76233ea47" }
etcetera = "0.11"
ffms2-sys = "0.3"
half = "2.7"
indicatif = "0.18"
pkg-config = "0.3"
schemars = "1.2.2"
semver = "1.0"
serde_json = "1.0.151"
sha2 = "0.11"
strum = "0.28"
strum_macros = "0.28"
tempfile = "3"
thiserror = "2.0.21"
tracing = "0.1"
tracing-indicatif = "0.3"
ureq = "3.4"
v_frame = "0.7"
y4m = "0.8"

clap = { version = "4.6", features = ["derive", "env"] }
cubecl = { git = "https://github.com/ChillFish8/cubecl", rev = "e3c9246de93b97e0f3355e18c86e3afbb7cbd2f5", features = ["std", "rusqlite"] }
cubecl-common = { git = "https://github.com/ChillFish8/cubecl", rev = "e3c9246de93b97e0f3355e18c86e3afbb7cbd2f5", default-features = false }
cubecl-environment = { git = "https://github.com/ChillFish8/cubecl", rev = "e3c9246de93b97e0f3355e18c86e3afbb7cbd2f5", default-features = false, features = ["rusqlite"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
jsonschema = { version = "0.58", default-features = false }
mimalloc = { version = "0.1.52", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1", default-features = false, features = ["std", "parse", "preserve_order"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "9.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

av-toolbox-build = { path = "av-toolbox-build", version = "0.2.0" }
av-toolbox-core = { path = "av-toolbox-core", version = "0.2.0" }
av-toolbox-cubek = { path = "av-toolbox-cubek", version = "0.2.0" }
av-toolbox-filters = { path = "av-toolbox-filters", version = "0.2.0" }
av-toolbox-gpu = { path = "av-toolbox-gpu", version = "0.2.0" }
av-toolbox-graph = { path = "av-toolbox-graph", version = "0.2.0" }
av-toolbox-masks = { path = "av-toolbox-masks", version = "0.2.0" }
av-toolbox-models = { path = "av-toolbox-models", version = "0.2.0" }
av-toolbox-pipeline = { path = "av-toolbox-pipeline", version = "0.2.0", default-features = false }
av-toolbox-providers = { path = "av-toolbox-providers", version = "0.2.0" }
av-toolbox-runtime = { path = "av-toolbox-runtime", version = "0.2.0" }
av-toolbox-sinks = { path = "av-toolbox-sinks", version = "0.2.0" }
av-toolbox-sources = { path = "av-toolbox-sources", version = "0.2.0", default-features = false }
avtbx-bestsource = { path = "thirdparty/bestsource", version = "0.2.0" }
avtbx-vship = { path = "thirdparty/vship", version = "0.2.0" }

av-scenechange = { version = "0.24", default-features = false, features = ["asm", "threading"] }
av-denoise-core = { git = "https://github.com/ChillFish8/av-denoise", rev = "d0359af24aac0a4ca52ae7ca5aedf6da22ae57f4", default-features = false }

# cubek builds on upstream CubeCL, so this keeps it on the same CubeCL build as everything else.
[patch."https://github.com/tracel-ai/cubecl"]
cubecl = { git = "https://github.com/ChillFish8/cubecl", rev = "e3c9246de93b97e0f3355e18c86e3afbb7cbd2f5" }
cubecl-common = { git = "https://github.com/ChillFish8/cubecl", rev = "e3c9246de93b97e0f3355e18c86e3afbb7cbd2f5" }
cubecl-environment = { git = "https://github.com/ChillFish8/cubecl", rev = "e3c9246de93b97e0f3355e18c86e3afbb7cbd2f5" }
cubecl-ir = { git = "https://github.com/ChillFish8/cubecl", rev = "e3c9246de93b97e0f3355e18c86e3afbb7cbd2f5" }
