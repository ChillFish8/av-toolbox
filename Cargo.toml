[workspace]
resolver = "3"
members = [
    "av-toolbox",
    "av-toolbox-core",
    "av-toolbox-cubek",
    "av-toolbox-filters",
    "av-toolbox-graph",
    "av-toolbox-masks",
    "av-toolbox-models",
    "av-toolbox-pipeline",
    "av-toolbox-runtime",
    "av-toolbox-gpu",
    "av-toolbox-sinks",
    "av-toolbox-sources",
    "av-toolbox-providers",
]

[workspace.package]
version = "0.1.0"
license = "EUPL-1.2"

[profile.test-release]
inherits = "release"
debug-assertions = true
overflow-checks = true

[workspace.dependencies]
bytesize = "2.7"
codespan-reporting = "0.13"
console = "0.16"
ctrlc = "3.5"
cubek-convolution = "=0.2.0"
cubek-matmul = "=0.2.0"
cubek-std = "=0.2.0"
etcetera = "0.11"
ffms2-sys = "0.3"
half = "2.7"
indicatif = "0.18"
pkg-config = "0.3"
schemars = "1.2.2"
semver = "1.0"
serde_json = "1.0.151"
sha2 = "0.11"
strum = "0.28"
strum_macros = "0.28"
tempfile = "3"
thiserror = "2.0.21"
tracing = "0.1"
tracing-indicatif = "0.3"
ureq = "3.4"
v_frame = "0.7"
y4m = "0.8"

clap = { version = "4.6", features = ["derive", "env"] }
cubecl = { version = "0.10", features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
jsonschema = { version = "0.58", default-features = false }
mimalloc = { version = "0.1.52", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1", default-features = false, features = ["std", "parse", "preserve_order"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "9.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

av-toolbox-gpu = { path = "av-toolbox-gpu" }
av-scenechange = { version = "0.24", default-features = false, features = ["asm", "threading"] }
av-denoise-core = { version = "=0.5.0", default-features = false }
