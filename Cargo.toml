[workspace]
resolver = "3"
members = [
    "av-toolbox",
    "av-toolbox-core", "av-toolbox-cubek",
    "av-toolbox-graph", "av-toolbox-runtime",
    "av-toolbox-gpu",
]

[profile.test-release]
inherits = "release"
debug-assertions = true

[workspace.dependencies]
av-toolbox-gpu = { path = "av-toolbox-gpu" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
schemars = "1.2.2"
jsonschema = { version = "0.56.0", default-features = false }
thiserror = "2.0.20"
av-scenechange = "0.24"
cubecl = { version = "0.10", features = ["std"] }
etcetera = "0.11"
strum = "0.28"
strum_macros = "0.28"
tracing = "0.1"
tempfile = "3"
