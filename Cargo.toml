[workspace]
resolver = "3"
members = [
    "av-toolbox",
    "av-toolbox-core",
    "av-toolbox-cubek",
    "av-toolbox-filters",
    "av-toolbox-graph",
    "av-toolbox-masks",
    "av-toolbox-pipeline",
    "av-toolbox-runtime",
    "av-toolbox-gpu",
    "av-toolbox-sinks",
    "av-toolbox-sources",
    "av-toolbox-transforms",
]

[profile.test-release]
inherits = "release"
debug-assertions = true
overflow-checks = true

[workspace.dependencies]
av-toolbox-gpu = { path = "av-toolbox-gpu" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
schemars = "1.2.2"
jsonschema = { version = "0.56.0", default-features = false }
thiserror = "2.0.20"
av-scenechange = { version = "0.24", default-features = false, features = ["asm", "threading"] }
v_frame = "0.7"
cubecl = { version = "0.10", features = ["std"] }
etcetera = "0.11"
strum = "0.28"
strum_macros = "0.28"
tracing = "0.1"
tempfile = "3"
y4m = "0.8"
ffms2-sys = "0.3"
toml = { version = "1.1", default-features = false, features = ["std", "parse", "preserve_order"] }
bytesize = "2.7"
clap = { version = "4.6", features = ["derive", "env"] }
codespan-reporting = "0.13"
ctrlc = "3.5"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
