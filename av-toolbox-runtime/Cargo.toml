[package]
name = "av-toolbox-runtime"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "The av-toolbox filter graph runtime."

[dependencies]
thiserror = { workspace = true }

av-toolbox-core = { path = "../av-toolbox-core" }
av-toolbox-gpu = { workspace = true }
av-toolbox-graph = { path = "../av-toolbox-graph" }

[dev-dependencies]
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

av-toolbox-core = { path = "../av-toolbox-core", features = ["test-support"] }
av-toolbox-gpu = { workspace = true, features = ["test-support"] }

[features]
vulkan = ["av-toolbox-gpu/vulkan", "av-toolbox-graph/vulkan"]
metal = ["av-toolbox-gpu/metal", "av-toolbox-graph/metal"]
cuda = ["av-toolbox-gpu/cuda", "av-toolbox-graph/cuda"]
rocm = ["av-toolbox-gpu/rocm", "av-toolbox-graph/rocm"]
gpu-tests = ["av-toolbox-gpu/gpu-tests"]
