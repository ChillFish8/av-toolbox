name: Release images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag, e.g. 0.2.0"
        required: true
        type: string
      push_latest:
        description: "Also move the -latest tag"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: ${{ matrix.backend }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [vulkan, cuda, rocm]
    concurrency:
      group: release-images-${{ matrix.backend }}-${{ github.event.release.tag_name || inputs.version }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache \
            /usr/local/share/powershell /usr/share/swift
          df -h /

      - name: Resolve and check version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: bash .github/scripts/resolve-version.sh

      - name: Resolve image tags
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          DISPATCH_PUSH_LATEST: ${{ inputs.push_latest }}
          VERSION: ${{ steps.version.outputs.version }}
          BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "release" ]; then
            stable="$([ "${RELEASE_PRERELEASE}" = "false" ] && echo true || echo false)"
          else
            stable="${DISPATCH_PUSH_LATEST}"
          fi

          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=("${image}:${BACKEND}-${VERSION}")

          if [ "${stable}" = "true" ]; then
            minor="${VERSION%%-*}"
            minor="${minor%.*}"
            tags+=("${image}:${BACKEND}-${minor}")
            tags+=("${image}:${BACKEND}-latest")
          fi

          {
            echo "tags<<GHTAGS"
            printf '%s\n' "${tags[@]}"
            echo "GHTAGS"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.backend }}.Dockerfile
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=EUPL-1.2
            org.opencontainers.image.description=av-toolbox (${{ matrix.backend }} backend)
