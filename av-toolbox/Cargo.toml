[package]
name = "av-toolbox"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
av-toolbox-core = { path = "../av-toolbox-core" }
av-toolbox-gpu = { workspace = true }
av-toolbox-graph = { path = "../av-toolbox-graph" }
av-toolbox-models = { path = "../av-toolbox-models" }
av-toolbox-pipeline = { path = "../av-toolbox-pipeline" }
av-toolbox-runtime = { path = "../av-toolbox-runtime" }
bytesize = { workspace = true }
clap = { workspace = true }
codespan-reporting = { workspace = true }
console = { workspace = true }
ctrlc = { workspace = true }
indicatif = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true, features = ["serde", "display"] }
tracing = { workspace = true }
tracing-indicatif = { workspace = true }
tracing-subscriber = { workspace = true }
ureq = { workspace = true }

[dev-dependencies]
image = { workspace = true }
y4m = { workspace = true }
zip = { workspace = true }

[features]
vulkan = ["av-toolbox-pipeline/vulkan", "av-toolbox-gpu/vulkan"]
metal = ["av-toolbox-pipeline/metal", "av-toolbox-gpu/metal"]
cuda = ["av-toolbox-pipeline/cuda", "av-toolbox-gpu/cuda"]
rocm = ["av-toolbox-pipeline/rocm", "av-toolbox-gpu/rocm"]
gpu-tests = ["av-toolbox-pipeline/gpu-tests"]
