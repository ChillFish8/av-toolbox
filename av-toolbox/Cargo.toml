[package]
name = "av-toolbox"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
description = "A command line tool for building and running GPU video processing pipelines."

[dependencies]
bytesize = { workspace = true }
clap = { workspace = true }
codespan-reporting = { workspace = true }
console = { workspace = true }
ctrlc = { workspace = true }
indicatif = { workspace = true }
mimalloc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-indicatif = { workspace = true }
tracing-subscriber = { workspace = true }
ureq = { workspace = true }

toml = { workspace = true, features = ["serde", "display"] }

av-toolbox-core = { workspace = true }
av-toolbox-gpu = { workspace = true }
av-toolbox-graph = { workspace = true }
av-toolbox-models = { workspace = true }
av-toolbox-pipeline = { workspace = true }
av-toolbox-runtime = { workspace = true }

[dev-dependencies]
image = { workspace = true }
y4m = { workspace = true }
zip = { workspace = true }

[build-dependencies]
pkg-config = { workspace = true, optional = true }

[features]
default = ["ffms2"]
ffms2 = ["av-toolbox-pipeline/ffms2"]
# Links ffms2 and FFmpeg statically from the vcpkg tree. See `just build-static`.
static-ffms2 = ["ffms2", "av-toolbox-pipeline/static-ffms2", "dep:pkg-config"]
bestsource = ["av-toolbox-pipeline/bestsource"]
# Links BestSource and FFmpeg statically from the vcpkg tree. See `just build-static`.
static-bestsource = ["bestsource", "av-toolbox-pipeline/static-bestsource"]
vulkan = ["av-toolbox-pipeline/vulkan", "av-toolbox-gpu/vulkan"]
metal = ["av-toolbox-pipeline/metal", "av-toolbox-gpu/metal"]
cuda = ["av-toolbox-pipeline/cuda", "av-toolbox-gpu/cuda"]
rocm = ["av-toolbox-pipeline/rocm", "av-toolbox-gpu/rocm"]
gpu-tests = ["av-toolbox-pipeline/gpu-tests"]

[package.metadata.docs.rs]
no-default-features = true
features = ["vulkan"]
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]
