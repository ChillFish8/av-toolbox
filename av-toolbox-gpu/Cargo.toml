[package]
name = "av-toolbox-gpu"
version = "0.1.0"
edition = "2024"
description = "Accelerator selection and device management for av-toolbox."

[dependencies]
cubecl = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[features]
vulkan = ["cubecl/vulkan"]
metal = ["cubecl/metal"]
cuda = ["cubecl/cuda"]
rocm = ["cubecl/hip"]
# Tests that need a real device. Not enabled in CI, which has no accelerator.
gpu-tests = []

[package.metadata.docs.rs]
features = ["vulkan"]
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]
