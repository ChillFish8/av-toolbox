[package]
name = "av-toolbox-gpu"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Accelerator selection and device management for av-toolbox."

[dependencies]
cubecl = { workspace = true }
etcetera = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
vulkan = ["cubecl/vulkan"]
metal = ["cubecl/metal"]
cuda = ["cubecl/cuda"]
rocm = ["cubecl/hip"]
# Tests that need a real device. Not enabled in CI, which has no accelerator.
gpu-tests = []
# Exposes a device-free context for crates above this one to test against.
test-support = []

[package.metadata.docs.rs]
features = ["vulkan"]
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]
