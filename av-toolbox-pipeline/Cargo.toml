[package]
name = "av-toolbox-pipeline"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

av-toolbox-core = { path = "../av-toolbox-core" }
av-toolbox-filters = { path = "../av-toolbox-filters" }
av-toolbox-gpu = { workspace = true }
av-toolbox-graph = { path = "../av-toolbox-graph" }
av-toolbox-masks = { path = "../av-toolbox-masks" }
av-toolbox-providers = { path = "../av-toolbox-providers" }
av-toolbox-runtime = { path = "../av-toolbox-runtime" }
av-toolbox-sinks = { path = "../av-toolbox-sinks" }
av-toolbox-sources = { path = "../av-toolbox-sources", default-features = false }

[dev-dependencies]
schemars = { workspace = true }
serde = { workspace = true }
tempfile = { workspace = true }
y4m = { workspace = true }

av-toolbox-cubek = { path = "../av-toolbox-cubek", features = ["test-support"] }
av-toolbox-gpu = { workspace = true, features = ["test-support"] }
av-toolbox-models = { path = "../av-toolbox-models" }

[features]
default = ["ffms2"]
ffms2 = ["av-toolbox-sources/ffms2"]
static-ffms2 = ["ffms2", "av-toolbox-sources/static-ffms2"]
vulkan = [
    "av-toolbox-gpu/vulkan",
    "av-toolbox-core/vulkan",
    "av-toolbox-filters/vulkan",
    "av-toolbox-graph/vulkan",
    "av-toolbox-masks/vulkan",
    "av-toolbox-runtime/vulkan",
    "av-toolbox-sinks/vulkan",
    "av-toolbox-sources/vulkan",
    "av-toolbox-providers/vulkan",
]
metal = [
    "av-toolbox-gpu/metal",
    "av-toolbox-core/metal",
    "av-toolbox-filters/metal",
    "av-toolbox-graph/metal",
    "av-toolbox-masks/metal",
    "av-toolbox-runtime/metal",
    "av-toolbox-sinks/metal",
    "av-toolbox-sources/metal",
    "av-toolbox-providers/metal",
]
cuda = [
    "av-toolbox-gpu/cuda",
    "av-toolbox-core/cuda",
    "av-toolbox-filters/cuda",
    "av-toolbox-graph/cuda",
    "av-toolbox-masks/cuda",
    "av-toolbox-runtime/cuda",
    "av-toolbox-sinks/cuda",
    "av-toolbox-sources/cuda",
    "av-toolbox-providers/cuda",
]
rocm = [
    "av-toolbox-gpu/rocm",
    "av-toolbox-core/rocm",
    "av-toolbox-filters/rocm",
    "av-toolbox-graph/rocm",
    "av-toolbox-masks/rocm",
    "av-toolbox-runtime/rocm",
    "av-toolbox-sinks/rocm",
    "av-toolbox-sources/rocm",
    "av-toolbox-providers/rocm",
]
gpu-tests = ["av-toolbox-gpu/gpu-tests"]
