[package]
name = "av-toolbox-cubek"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Shared CubeCL kernels that can be used within av-toolbox video filters."

[dependencies]
cubecl = { workspace = true }
cubek-convolution = { workspace = true }
cubek-matmul = { workspace = true }
cubek-std = { workspace = true }
half = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
av-toolbox-cubek = { path = ".", features = ["test-support"] }
av-toolbox-gpu = { workspace = true, features = ["test-support"] }
av-toolbox-models = { path = "../av-toolbox-models" }

[features]
vulkan = ["cubecl/vulkan", "av-toolbox-gpu/vulkan"]
metal = ["cubecl/metal", "av-toolbox-gpu/metal"]
cuda = ["cubecl/cuda", "av-toolbox-gpu/cuda"]
rocm = ["cubecl/hip", "av-toolbox-gpu/rocm"]
gpu-tests = ["av-toolbox-gpu/gpu-tests"]
# Exposes CPU references of the kernels for tests in this crate and the crates above it.
test-support = []
