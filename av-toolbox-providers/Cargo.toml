[package]
name = "av-toolbox-providers"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
av-scenechange = { workspace = true }
av-toolbox-core = { path = "../av-toolbox-core" }
av-toolbox-gpu = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
v_frame = { workspace = true }

[dev-dependencies]
av-toolbox-gpu = { workspace = true, features = ["test-support"] }
av-toolbox-graph = { path = "../av-toolbox-graph" }
av-toolbox-runtime = { path = "../av-toolbox-runtime" }
av-toolbox-sources = { path = "../av-toolbox-sources", default-features = false }
serde_json = { workspace = true }
y4m = { workspace = true }

[features]
vulkan = ["av-toolbox-gpu/vulkan", "av-toolbox-core/vulkan"]
metal = ["av-toolbox-gpu/metal", "av-toolbox-core/metal"]
cuda = ["av-toolbox-gpu/cuda", "av-toolbox-core/cuda"]
rocm = ["av-toolbox-gpu/rocm", "av-toolbox-core/rocm"]
gpu-tests = ["av-toolbox-gpu/gpu-tests"]
