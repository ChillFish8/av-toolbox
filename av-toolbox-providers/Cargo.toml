[package]
name = "av-toolbox-providers"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
description = "Providers that supply what av-toolbox stages demand."

[dependencies]
schemars = { workspace = true }
serde = { workspace = true }
v_frame = { workspace = true }

av-toolbox-core = { workspace = true }
av-toolbox-gpu = { workspace = true }
av-scenechange = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
y4m = { workspace = true }

av-toolbox-gpu = { workspace = true, features = ["test-support"] }
av-toolbox-graph = { workspace = true }
av-toolbox-runtime = { workspace = true }
av-toolbox-sources = { workspace = true }

[features]
vulkan = ["av-toolbox-gpu/vulkan", "av-toolbox-core/vulkan"]
metal = ["av-toolbox-gpu/metal", "av-toolbox-core/metal"]
cuda = ["av-toolbox-gpu/cuda", "av-toolbox-core/cuda"]
rocm = ["av-toolbox-gpu/rocm", "av-toolbox-core/rocm"]
gpu-tests = ["av-toolbox-gpu/gpu-tests"]

[package.metadata.docs.rs]
features = ["vulkan"]
targets = ["x86_64-unknown-linux-gnu"]
