<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline graph</title>
<style>
{{style}}
</style>
<script src="https://cdn.jsdelivr.net/npm/elkjs@0.9.3/lib/elk.bundled.js" integrity="sha384-KO35c6PFq7tFxAEx6FtATwL9vOBOmCzQYr7GM0iTr3oO22s7Jc9OkclOH4AV7jwK" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js" integrity="sha384-yc/c2Lk1s2V2ir1rxvjo8YyVD9PlOlYTqpNr3Wm1WIuAA30GlDYNx6U5104OiavY" crossorigin="anonymous"></script>
</head>
<body>
<header>
<strong>Pipeline graph</strong>
<span class="legend-item"><svg width="28" height="8"><line x1="0" y1="4" x2="28" y2="4" class="link bounded"/></svg>bounded</span>
<span class="legend-item"><svg width="28" height="8"><line x1="0" y1="4" x2="28" y2="4" class="link unbounded"/></svg>unbounded</span>
<span class="legend-item"><svg width="28" height="8"><line x1="0" y1="4" x2="28" y2="4" class="link local"/></svg>inside one worker</span>
<span class="legend-item"><svg width="22" height="14"><rect x="1" y="1" width="20" height="12" rx="2" class="legend-crossing"/></svg>host and gpu crossing</span>
<span class="legend-item"><svg width="26" height="18"><rect x="7" y="7" width="18" height="10" rx="2" class="legend-stack"/><rect x="4" y="4" width="18" height="10" rx="2" class="legend-stack"/><rect x="1" y="1" width="18" height="10" rx="2" class="legend-stack"/></svg>several workers</span>
</header>
<main id="canvas"></main>
<p id="message" hidden></p>
<script type="application/json" id="diagram">{{diagram}}</script>
<script>
{{script}}
</script>
</body>
</html>
