[package]
name = "av-toolbox-graph"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
serde_json = { workspace = true }
thiserror = { workspace = true }

av-toolbox-core = { path = "../av-toolbox-core" }
av-toolbox-gpu = { workspace = true }

[dev-dependencies]
schemars = { workspace = true }
serde = { workspace = true }

av-toolbox-core = { path = "../av-toolbox-core", features = ["test-support"] }
av-toolbox-gpu = { workspace = true, features = ["test-support"] }

[features]
vulkan = ["av-toolbox-gpu/vulkan"]
metal = ["av-toolbox-gpu/metal"]
cuda = ["av-toolbox-gpu/cuda"]
rocm = ["av-toolbox-gpu/rocm"]
gpu-tests = ["av-toolbox-gpu/gpu-tests"]
