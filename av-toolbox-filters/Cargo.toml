[package]
name = "av-toolbox-filters"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
description = "Filters that change the frames of av-toolbox pipelines."

[dependencies]
cubecl = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

av-toolbox-core = { workspace = true }
av-toolbox-cubek = { workspace = true }
av-toolbox-gpu = { workspace = true }
av-toolbox-models = { workspace = true }
av-toolbox-providers = { workspace = true }
av-denoise-core = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

av-toolbox-cubek = { workspace = true, features = ["test-support"] }
av-toolbox-filters = { path = ".", features = ["test-support"] }
av-toolbox-gpu = { workspace = true, features = ["test-support"] }

[features]
vulkan = ["av-toolbox-gpu/vulkan", "av-toolbox-core/vulkan", "av-toolbox-providers/vulkan", "av-toolbox-cubek/vulkan", "av-denoise-core/vulkan"]
metal = ["av-toolbox-gpu/metal", "av-toolbox-core/metal", "av-toolbox-providers/metal", "av-toolbox-cubek/metal", "av-denoise-core/metal"]
cuda = ["av-toolbox-gpu/cuda", "av-toolbox-core/cuda", "av-toolbox-providers/cuda", "av-toolbox-cubek/cuda", "av-denoise-core/cuda"]
rocm = ["av-toolbox-gpu/rocm", "av-toolbox-core/rocm", "av-toolbox-providers/rocm", "av-toolbox-cubek/rocm", "av-denoise-core/rocm"]
gpu-tests = ["av-toolbox-gpu/gpu-tests"]
# Exposes internals for tests in this crate's tests/device suite.
test-support = []

[package.metadata.docs.rs]
features = ["vulkan"]
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]
