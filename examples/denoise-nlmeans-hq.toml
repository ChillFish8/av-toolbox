# Reads a video, denoises it with av-denoise's noise-measuring non-local means, and writes it back.
#
# The noise is measured in every frame and the strength follows it, so sigma_scale nudges the result rather than
# setting it. Motion compensation lines neighbouring frames up before they are averaged.

[variable.input]
type = "path"
description = "The clip to read"
default = "input.y4m"

[variable.preset]
type = "string"
description = "How much quality to trade for speed"
default = "base"
choices = ["veryfast", "fast", "base", "slow", "veryslow"]

[variable.sigma_scale]
type = "float"
description = "A multiplier on the measured noise, above 1 to denoise harder"
default = 1.0

[variable.output]
type = "path"
description = "Where to write the y4m stream"
default = "output.y4m"

[source.input]
type = "ffms2/file"
args.path = "{{ input }}"

[filter.denoise]
type = "av-denoise/nlmeans-hq"
inputs = ["input"]
args.preset = "{{ preset }}"
args.sigma_scale = "{{ sigma_scale }}"
args.motion_compensation = true

[sink.output]
type = "y4m/pipe"
inputs = ["denoise"]
args.path = "{{ output }}"
