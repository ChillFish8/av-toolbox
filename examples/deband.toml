# Reads a video, smooths its banding with libplacebo's algorithm, and writes it back.
#
# Luma is deband harder than chroma, and only luma gets grain.

[variable.input]
type = "path"
description = "The clip to read"
default = "input.y4m"

[variable.output]
type = "path"
description = "Where to write the y4m stream"
default = "output.y4m"

[source.input]
type = "ffms2/file"
args.path = "{{ input }}"

[filter.deband]
type = "deband/placebo"
inputs = ["input"]
args.iterations = 2
args.threshold = [4.0, 3.0, 3.0]
args.grain = [6.0, 0.0, 0.0]

[sink.output]
type = "y4m/pipe"
inputs = ["deband"]
args.path = "{{ output }}"
