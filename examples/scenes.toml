# Decodes a video, writes it out as y4m and logs where its scenes break as one line of JSON per frame.
#
# Each line carries the frame's scene as `chunk`, and how strongly the detector favoured a cut before it.

[variable.input]
type = "path"
description = "The video to decode"
default = "input.mkv"

[variable.scenes]
type = "path"
description = "Where to write the scene log"
default = "scenes.ndjson"

[variable.output]
type = "path"
description = "Where to write the y4m stream"
default = "output.y4m"

[source.clip]
type = "ffms2/file"
args.path = "{{ input }}"

[sink.output]
type = "y4m/pipe"
inputs = ["clip"]
args.path = "{{ output }}"

[sink.log]
type = "metadata/ndjson"
inputs = ["clip"]
args.path = "{{ scenes }}"
args.scenes = { breaks = { mode = "natural" } }
