# Reads a video, removes halos around its edges and the ringing beside them on luma, and writes it back.
#
# dehalo/fine only touches a band around strong edges. dering/hq then smooths ringing in a mask built around the
# edges it finds.

[variable.input]
type = "path"
description = "The clip to read"
default = "input.y4m"

[variable.output]
type = "path"
description = "Where to write the y4m stream"
default = "output.y4m"

[source.input]
type = "ffms2/file"
args.path = "{{ input }}"

[filter.dehalo]
type = "dehalo/fine"
inputs = ["input"]

[filter.dering]
type = "dering/hq"
inputs = ["dehalo"]

[sink.output]
type = "y4m/pipe"
inputs = ["dering"]
args.path = "{{ output }}"
