

[sources.input_A]
type = "file"
input = "example.mkv"

[sources.input_B]
type = "variable"

[filter.denoise_example]
type = "denoise/av-denoise/nl4d"
inputs = ["input_A"]
args.sigma_scale = 0.8

[filter.deband_example]
type = "deband/placebo"
inputs = ["denoise_example", "input_C"]

[transform.scene_splitter]
type = "split"
input = ["deband_example"]
max_scene_secs = 10

[sinks.stdout_sink_example]
type = "stdout"
inputs = ["deband_example"]

[sinks.encoder]
type = "process"
inputs = ["scene_splitter"]
chunk_parallel = true
binary = "SvtAv1EncApp"
args = "--crf 25"

[sinks.ffvship]
type = "vship"
inputs = ["deband_example"]
metric = "CVVDP"
display_model = "example_etc"