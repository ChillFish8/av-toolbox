# Marks scene changes in a stream. Called from chunked.toml.

[variable.speed]
type = "string"
description = "How carefully to compare frames"
default = "standard"
choices = ["standard", "fast"]

[input.clip]
description = "The stream to split"

[transform.detect]
type = "scene/detect"
inputs = ["clip"]
args.mode = "natural"
args.speed = "{{ speed }}"

[output.scenes]
inputs = ["detect"]
