# Compares a distorted video against its reference with CVVDP at a display's resolution and shows the distorted
# video as a heatmap.
#
# CVVDP scales both clips to fit the display before scoring, so its map comes out at the display's size. The map is
# scaled back to the distorted clip's size before it is painted.
# The display model can be swapped for a JSON file in Vship's format.
# Needs the `vship` feature.

[variable.reference]
type = "path"
description = "The original clip"
default = "reference.mkv"

[variable.distorted]
type = "path"
description = "The clip to compare against the original"
default = "distorted.mkv"

[variable.display]
type = "string"
description = """\
The display CVVDP models viewing on. One of standard_4k, standard_fhd, standard_hdr_pq, standard_hdr_hlg, \
standard_hdr_dark or standard_hdr_linear_zoom, or the name a custom display model defines"""
default = "standard_4k"

[variable.display_config]
type = "path"
description = "A JSON display model in Vship's format, used for the display named by `display`"
optional = true

[variable.style]
type = "string"
description = "The colours of the heatmap"
default = "blue"
choices = ["blue", "heat"]

[source.reference]
type = "ffms2/file"
args.path = "{{ reference }}"

[source.distorted]
type = "ffms2/file"
args.path = "{{ distorted }}"

[filter.score]
type = "vship/cvvdp"
inputs = ["reference", "distorted"]
args.display = "{{ display }}"
args.display_config = "{{ if display_config is not none then read(display_config) else none }}"
args.resize_to_display = true
args.output = "map"

[filter.clip_sized]
type = "resize/bilinear"
inputs = ["score"]
args.width = "{{ distorted.width }}"
args.height = "{{ distorted.height }}"

[filter.heatmap]
type = "blend/heatmap"
inputs = ["distorted", "clip_sized"]
args.style = "{{ style }}"
args.scale = 0.003

[sink.output]
type = "y4m/stdout"
inputs = ["heatmap"]
