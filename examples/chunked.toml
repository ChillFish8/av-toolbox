# Reads a video, denoises it on two workers and writes it out as y4m.
#
# The denoise asks for scene breaks, so each worker is handed whole scenes to filter.

[variable.input]
type = "path"
description = "The video to decode"
default = "input.mkv"

[variable.output]
type = "path"
description = "Where to write the y4m stream"
default = "output.y4m"

[source.input]
type = "ffms2/file"
args.path = "{{ input }}"

[filter.denoise]
type = "av-denoise/nl4d"
inputs = ["input"]
workers = 2

[sink.output]
type = "y4m/pipe"
inputs = ["denoise"]
args.path = "{{ output }}"
