# Cleans the lines of a clip with lineart/vinverse, then lineart/thin, then lineart/darken.
#
# vinverse removes residual combing on every plane. On luma, thin narrows anti-aliased lines and darken
# deepens faded ones. thin can lighten the thinnest lines.

[variable.input]
type = "path"
description = "The clip to read"
default = "input.y4m"

[variable.output]
type = "path"
description = "Where to write the y4m stream"
default = "output.y4m"

[source.input]
type = "y4m/pipe"
args.path = "{{ input }}"

[filter.decombed]
type = "lineart/vinverse"
inputs = ["input"]

[filter.thinned]
type = "lineart/thin"
inputs = ["decombed"]

[filter.darkened]
type = "lineart/darken"
inputs = ["thinned"]

[sink.output]
type = "y4m/pipe"
inputs = ["darkened"]
args.path = "{{ output }}"
