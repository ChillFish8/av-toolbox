# Compares a distorted video against its reference with CVVDP and writes the distortion map to standard output as y4m.
#
# Brighter pixels show where differences are more visible. Each map frame also carries the running score.
# Needs the `vship` feature.

[variable.reference]
type = "path"
description = "The original clip"
default = "reference.mkv"

[variable.distorted]
type = "path"
description = "The clip to compare against the original"
default = "distorted.mkv"

[source.reference]
type = "ffms2/file"
args.path = "{{ reference }}"

[source.distorted]
type = "ffms2/file"
args.path = "{{ distorted }}"

[filter.score]
type = "vship/cvvdp"
inputs = ["reference", "distorted"]
args.output = "map"

[filter.eight_bit]
type = "resample/depth"
inputs = ["score"]
args.depth = 8
args.dither = "none"

[sink.output]
type = "y4m/stdout"
inputs = ["eight_bit"]
