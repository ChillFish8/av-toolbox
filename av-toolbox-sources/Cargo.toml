[package]
name = "av-toolbox-sources"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
description = "Sources that bring video into av-toolbox pipelines."

[dependencies]
image = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
y4m = { workspace = true }

ffms2-sys = { workspace = true, optional = true }
avtbx-bestsource = { workspace = true, optional = true }

av-toolbox-core = { workspace = true }
av-toolbox-cubek = { workspace = true }
av-toolbox-gpu = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }

av-toolbox-gpu = { workspace = true, features = ["test-support"] }
av-toolbox-graph = { workspace = true }
av-toolbox-runtime = { workspace = true }

[features]
default = ["ffms2"]
ffms2 = ["dep:ffms2-sys"]
# Links the ffms2 archive from FFMS_LIB_DIR instead of a shared library.
static-ffms2 = ["ffms2", "ffms2-sys/static"]
bestsource = ["dep:avtbx-bestsource"]
# Links the BestSource archive from BESTSOURCE_LIB_DIR instead of building it.
static-bestsource = ["bestsource", "avtbx-bestsource/static"]
vulkan = ["av-toolbox-gpu/vulkan", "av-toolbox-core/vulkan", "av-toolbox-cubek/vulkan"]
metal = ["av-toolbox-gpu/metal", "av-toolbox-core/metal", "av-toolbox-cubek/metal"]
cuda = ["av-toolbox-gpu/cuda", "av-toolbox-core/cuda", "av-toolbox-cubek/cuda"]
rocm = ["av-toolbox-gpu/rocm", "av-toolbox-core/rocm", "av-toolbox-cubek/rocm"]
gpu-tests = ["av-toolbox-gpu/gpu-tests"]

[package.metadata.docs.rs]
no-default-features = true
features = ["vulkan"]
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]
